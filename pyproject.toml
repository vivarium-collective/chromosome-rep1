[project]
name = "pbg_chromosome_rep1"
version = "0.0.0"
description = "chromosome-rep1 — process-bigraph model"
requires-python = ">=3.11"
dependencies = ["process-bigraph", "bigraph-schema"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_chromosome_rep1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
